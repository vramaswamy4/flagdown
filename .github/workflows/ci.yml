name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Go modules
        id: mods
        run: |
          if [ -n "$(find . -name go.mod -not -path '*/vendor/*' -print -quit)" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
        shell: bash
      - uses: actions/setup-go@v5
        if: steps.mods.outputs.found == 'true'
        with:
          go-version: "1.23"
      - name: Vet and test every module
        if: steps.mods.outputs.found == 'true'
        run: |
          set -e
          for m in $(find . -name go.mod -not -path '*/vendor/*' -exec dirname {} \;); do
            echo "== $m"; (cd "$m" && go vet ./... && go test ./... -race -count=1)
          done
      - name: Nothing to test yet
        if: steps.mods.outputs.found == 'false'
        run: echo "No go.mod found; skipping."
